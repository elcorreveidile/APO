<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - Estoy Bien</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB;
            color: #374151;
        }

        h1, h2, h3 {
            font-family: 'Poppins', sans-serif;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .timeline-item {
            position: relative;
            padding-left: 40px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 40px;
            bottom: -20px;
            width: 2px;
            background: linear-gradient(to bottom, #10B981, transparent);
        }

        .timeline-item:last-child::before {
            display: none;
        }

        .timeline-dot {
            position: absolute;
            left: 8px;
            top: 8px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            border: 3px solid #10B981;
        }

        .stat-card {
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: white;
            border-radius: 16px;
            padding: 20px;
        }

        .filter-button {
            transition: all 0.2s ease;
        }

        .filter-button.active {
            background: #3B82F6;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <button onclick="window.location.href='estoy-bien.html'" class="text-gray-600 hover:text-gray-800">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <h1 class="text-2xl font-bold text-gray-800">Historial de Check-ins</h1>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- Statistics -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="stat-card">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-white/80 text-sm">Total Check-ins</span>
                    <span class="text-3xl">✓</span>
                </div>
                <p class="text-3xl font-bold" id="total-checkins">0</p>
            </div>

            <div class="stat-card" style="background: linear-gradient(135deg, #10B981, #059669);">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-white/80 text-sm">Racha Actual</span>
                    <span class="text-3xl">🔥</span>
                </div>
                <p class="text-3xl font-bold" id="current-streak">0 días</p>
            </div>

            <div class="stat-card" style="background: linear-gradient(135deg, #F59E0B, #D97706);">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-white/80 text-sm">Última Alerta</span>
                    <span class="text-3xl">🔔</span>
                </div>
                <p class="text-xl font-bold" id="last-alert">Ninguna</p>
            </div>
        </div>

        <!-- Filters -->
        <div class="card p-4 mb-6">
            <div class="flex items-center space-x-2 overflow-x-auto">
                <button onclick="filterHistory('all')" class="filter-button active px-4 py-2 rounded-lg bg-gray-100 text-gray-700 whitespace-nowrap text-sm font-medium" data-filter="all">
                    Todos
                </button>
                <button onclick="filterHistory('today')" class="filter-button px-4 py-2 rounded-lg bg-gray-100 text-gray-700 whitespace-nowrap text-sm font-medium" data-filter="today">
                    Hoy
                </button>
                <button onclick="filterHistory('week')" class="filter-button px-4 py-2 rounded-lg bg-gray-100 text-gray-700 whitespace-nowrap text-sm font-medium" data-filter="week">
                    Esta Semana
                </button>
                <button onclick="filterHistory('month')" class="filter-button px-4 py-2 rounded-lg bg-gray-100 text-gray-700 whitespace-nowrap text-sm font-medium" data-filter="month">
                    Este Mes
                </button>
            </div>
        </div>

        <!-- Timeline -->
        <div class="card p-6">
            <h2 class="text-xl font-semibold mb-6">Línea de Tiempo</h2>
            <div id="timeline-container">
                <!-- Timeline items will be inserted here -->
            </div>

            <div id="no-history-message" class="text-center py-12 hidden">
                <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-4xl">📅</span>
                </div>
                <p class="text-gray-600 text-lg mb-2">No hay check-ins en este período</p>
                <p class="text-gray-500 text-sm">Intenta con un filtro diferente</p>
            </div>
        </div>

        <!-- Alert History -->
        <div class="card p-6 mt-8">
            <h2 class="text-xl font-semibold mb-6">Historial de Alertas</h2>
            <div id="alerts-container">
                <!-- Alert history will be inserted here -->
            </div>

            <div id="no-alerts-message" class="text-center py-12">
                <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-4xl">✓</span>
                </div>
                <p class="text-gray-600 text-lg mb-2">¡No has tenido alertas!</p>
                <p class="text-gray-500 text-sm">Sigue haciendo tus check-ins diarios</p>
            </div>
        </div>
    </main>

    <script src="estoy-bien.js"></script>
    <script>
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', function() {
            loadStatistics();
            loadTimeline();
            loadAlertHistory();
        });

        function loadStatistics() {
            const checkIns = JSON.parse(localStorage.getItem('estoyBienCheckIns') || '[]');
            const alertLogs = JSON.parse(localStorage.getItem('estoyBienAlertLogs') || '[]');

            // Total check-ins
            document.getElementById('total-checkins').textContent = checkIns.length;

            // Current streak
            const streak = calculateStreak(checkIns);
            document.getElementById('current-streak').textContent = `${streak} día${streak !== 1 ? 's' : ''}`;

            // Last alert
            if (alertLogs.length > 0) {
                const lastAlert = alertLogs[0];
                const alertDate = new Date(lastAlert.timestamp);
                document.getElementById('last-alert').textContent = alertDate.toLocaleDateString('es-ES');
            }
        }

        function calculateStreak(checkIns) {
            if (checkIns.length === 0) return 0;

            let streak = 0;
            let currentDate = new Date();
            currentDate.setHours(0, 0, 0, 0);

            for (let i = 0; i < checkIns.length; i++) {
                const checkInDate = new Date(checkIns[i].timestamp);
                checkInDate.setHours(0, 0, 0, 0);

                const daysDiff = Math.floor((currentDate - checkInDate) / (1000 * 60 * 60 * 24));

                if (daysDiff === streak) {
                    streak++;
                } else if (daysDiff > streak) {
                    break;
                }
            }

            return streak;
        }

        function loadTimeline(filter = 'all') {
            const checkIns = JSON.parse(localStorage.getItem('estoyBienCheckIns') || '[]');
            const container = document.getElementById('timeline-container');
            const noHistoryMessage = document.getElementById('no-history-message');

            let filteredCheckIns = filterCheckIns(checkIns, filter);

            if (filteredCheckIns.length === 0) {
                container.innerHTML = '';
                noHistoryMessage.classList.remove('hidden');
            } else {
                noHistoryMessage.classList.add('hidden');
                container.innerHTML = filteredCheckIns.map((checkIn, index) => {
                    const date = new Date(checkIn.timestamp);
                    const isToday = date.toDateString() === new Date().toDateString();
                    const dayOfWeek = date.toLocaleDateString('es-ES', { weekday: 'long' });

                    return `
                        <div class="timeline-item mb-8">
                            <div class="timeline-dot"></div>
                            <div class="bg-gray-50 rounded-xl p-4 ${isToday ? 'ring-2 ring-green-500' : ''}">
                                <div class="flex items-start justify-between mb-2">
                                    <div>
                                        <h4 class="font-semibold text-lg">${checkIn.date}</h4>
                                        <p class="text-sm text-gray-500 capitalize">${dayOfWeek}</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium ${
                                            isToday ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-700'
                                        }">
                                            ${isToday ? '✓ Hoy' : checkIn.time}
                                        </span>
                                    </div>
                                </div>
                                <div class="flex items-center text-sm text-gray-600 mt-3">
                                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                    Check-in realizado a las ${checkIn.time}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function filterCheckIns(checkIns, filter) {
            const now = new Date();
            now.setHours(0, 0, 0, 0);

            switch (filter) {
                case 'today':
                    return checkIns.filter(checkIn => {
                        const date = new Date(checkIn.timestamp);
                        date.setHours(0, 0, 0, 0);
                        return date.getTime() === now.getTime();
                    });

                case 'week':
                    const weekAgo = new Date(now);
                    weekAgo.setDate(weekAgo.getDate() - 7);
                    return checkIns.filter(checkIn => {
                        const date = new Date(checkIn.timestamp);
                        return date >= weekAgo;
                    });

                case 'month':
                    const monthAgo = new Date(now);
                    monthAgo.setMonth(monthAgo.getMonth() - 1);
                    return checkIns.filter(checkIn => {
                        const date = new Date(checkIn.timestamp);
                        return date >= monthAgo;
                    });

                default:
                    return checkIns;
            }
        }

        function filterHistory(filter) {
            currentFilter = filter;

            // Update button states
            document.querySelectorAll('.filter-button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.filter === filter) {
                    btn.classList.add('active');
                }
            });

            // Reload timeline with filter
            loadTimeline(filter);
        }

        function loadAlertHistory() {
            const alertLogs = JSON.parse(localStorage.getItem('estoyBienAlertLogs') || '[]');
            const container = document.getElementById('alerts-container');
            const noAlertsMessage = document.getElementById('no-alerts-message');

            if (alertLogs.length === 0) {
                container.innerHTML = '';
                noAlertsMessage.classList.remove('hidden');
            } else {
                noAlertsMessage.classList.add('hidden');
                container.innerHTML = alertLogs.map(alert => {
                    const date = new Date(alert.timestamp);
                    const levelColor = alert.level === '72h' ? 'red' : alert.level === '48h' ? 'orange' : 'yellow';
                    const levelIcon = alert.level === '72h' ? '🚨' : alert.level === '48h' ? '🔔' : '⚠️';

                    return `
                        <div class="border-l-4 border-${levelColor}-500 bg-${levelColor}-50 p-4 rounded-r-lg mb-4">
                            <div class="flex items-start justify-between">
                                <div class="flex items-start space-x-3">
                                    <span class="text-2xl">${levelIcon}</span>
                                    <div>
                                        <h4 class="font-semibold text-${levelColor}-900">
                                            Alerta ${alert.level}
                                        </h4>
                                        <p class="text-sm text-${levelColor}-700 mt-1">
                                            ${date.toLocaleString('es-ES')}
                                        </p>
                                        <p class="text-sm text-${levelColor}-600 mt-2">
                                            Contactos notificados: ${alert.contacts.join(', ')}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }
    </script>
</body>
</html>
