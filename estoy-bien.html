<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoy Bien - Check-in Diario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-suave: #10B981;
            --azul-calma: #3B82F6;
            --naranja-alerta: #F59E0B;
            --rojo-urgente: #EF4444;
            --gris-fondo: #F9FAFB;
            --gris-texto: #374151;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--gris-fondo);
            color: var(--gris-texto);
        }

        h1, h2, h3 {
            font-family: 'Poppins', sans-serif;
        }

        .check-in-button {
            background: linear-gradient(135deg, #10B981, #059669);
            box-shadow: 0 10px 40px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
        }

        .check-in-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(16, 185, 129, 0.4);
        }

        .check-in-button:active {
            transform: scale(0.98);
        }

        .check-in-button.disabled {
            background: linear-gradient(135deg, #9CA3AF, #6B7280);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .pulse-animation {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .status-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .alert-badge {
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(-5%);
                animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
            }
            50% {
                transform: translateY(0);
                animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
            }
        }

        .contact-item {
            transition: all 0.2s ease;
        }

        .contact-item:hover {
            background-color: #F3F4F6;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-green-400 to-green-600 rounded-full flex items-center justify-center">
                        <span class="text-white text-2xl">✓</span>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800">Estoy Bien</h1>
                </div>
                <button onclick="window.location.href='estoy-bien-contactos.html'" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                    Contactos
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- Estado Actual -->
        <div class="status-card p-8 mb-8">
            <div class="text-center">
                <div id="status-icon" class="w-32 h-32 mx-auto mb-6 rounded-full flex items-center justify-center">
                    <!-- Icon will be inserted by JS -->
                </div>
                <h2 id="status-title" class="text-3xl font-bold mb-3">
                    <!-- Title will be inserted by JS -->
                </h2>
                <p id="status-message" class="text-gray-600 text-lg mb-6">
                    <!-- Message will be inserted by JS -->
                </p>

                <!-- Check-in Button -->
                <button id="check-in-btn" onclick="handleCheckIn()" class="check-in-button text-white px-12 py-5 rounded-2xl font-semibold text-xl">
                    Reportar "Estoy Bien"
                </button>

                <!-- Last Check-in Info -->
                <div id="last-check-in" class="mt-6 text-sm text-gray-500">
                    <!-- Last check-in info will be inserted by JS -->
                </div>
            </div>
        </div>

        <!-- Información de Alertas -->
        <div class="status-card p-6 mb-8">
            <h3 class="text-xl font-semibold mb-4 flex items-center">
                <span class="text-2xl mr-3">⏰</span>
                Sistema de Alertas
            </h3>
            <div class="space-y-3">
                <div id="alert-24h" class="flex items-center justify-between p-4 rounded-lg bg-gray-50">
                    <div class="flex items-center space-x-3">
                        <div class="w-3 h-3 rounded-full bg-gray-400"></div>
                        <span class="font-medium">Alerta 24 horas</span>
                    </div>
                    <span class="text-sm text-gray-600" id="alert-24h-time">--</span>
                </div>
                <div id="alert-48h" class="flex items-center justify-between p-4 rounded-lg bg-gray-50">
                    <div class="flex items-center space-x-3">
                        <div class="w-3 h-3 rounded-full bg-gray-400"></div>
                        <span class="font-medium">Alerta 48 horas</span>
                    </div>
                    <span class="text-sm text-gray-600" id="alert-48h-time">--</span>
                </div>
                <div id="alert-72h" class="flex items-center justify-between p-4 rounded-lg bg-gray-50">
                    <div class="flex items-center space-x-3">
                        <div class="w-3 h-3 rounded-full bg-gray-400"></div>
                        <span class="font-medium">Alerta 72 horas</span>
                    </div>
                    <span class="text-sm text-gray-600" id="alert-72h-time">--</span>
                </div>
            </div>
        </div>

        <!-- Contactos de Confianza -->
        <div class="status-card p-6 mb-8">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-semibold flex items-center">
                    <span class="text-2xl mr-3">👥</span>
                    Contactos de Confianza
                </h3>
                <button onclick="window.location.href='estoy-bien-contactos.html'" class="text-blue-500 hover:text-blue-600 font-medium text-sm">
                    Gestionar
                </button>
            </div>
            <div id="contacts-list" class="space-y-2">
                <!-- Contacts will be inserted by JS -->
            </div>
        </div>

        <!-- Historial Reciente -->
        <div class="status-card p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-semibold flex items-center">
                    <span class="text-2xl mr-3">📅</span>
                    Historial Reciente
                </h3>
                <button onclick="window.location.href='estoy-bien-historial.html'" class="text-blue-500 hover:text-blue-600 font-medium text-sm">
                    Ver Todo
                </button>
            </div>
            <div id="history-list" class="space-y-2">
                <!-- History will be inserted by JS -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto px-4 py-8 text-center text-sm text-gray-500">
        <p>Estoy Bien - Tu sistema de bienestar diario</p>
        <p class="mt-2">Ayudando a personas que viven solas a mantenerse conectadas</p>
    </footer>

    <script src="estoy-bien.js"></script>
    <script>
        // Initialize the app when the page loads
        document.addEventListener('DOMContentLoaded', function() {
            initApp();
        });
    </script>
</body>
</html>
